version: 1
type: Connection
field: state
initial: new
states:
  - name: new
    value: NEW
  - name: open
    value: OPEN
  - name: closed
    value: CLOSED
  - name: unused
    value: UNUSED
transitions:
  - from: new
    to: open
    event: connect
    guard: ready
    action: open transport
  - from: open
    to: closed
    event: close
    guard: reason == 1
    action: close transport
