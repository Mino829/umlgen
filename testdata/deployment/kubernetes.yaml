apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: demo}
spec:
  replicas: 2
  selector:
    matchLabels: {app: orders-api}
  template:
    metadata:
      labels: {app: orders-api}
    spec:
      containers:
        - name: api
          image: example.test/orders-api:v1
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: EXAMPLE_PRIVATE_VALUE, value: fixture-only-do-not-display}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: demo}
spec:
  selector: {app: orders-api}
  ports: [{port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: storage, namespace: demo}
spec:
  replicas: 1
  serviceName: storage
  selector:
    matchLabels: {app: storage}
  template:
    metadata:
      labels: {app: storage}
    spec:
      containers:
        - {name: storage, image: 'postgres:17'}
---
apiVersion: v1
kind: Service
metadata: {name: storage, namespace: demo}
spec:
  selector: {app: storage}
  ports: [{port: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: manually-managed, namespace: demo}
spec:
  ports: [{port: 443}]
---
apiVersion: v1
kind: Secret
metadata: {name: fixture-secret, namespace: demo}
stringData:
  password: fixture-only-do-not-display
