name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate strict SemVer tag
        id: version
        shell: python {0}
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          import os
          import runpy

          tag = os.environ["RELEASE_REF_NAME"]
          if not tag.startswith("v"):
              raise SystemExit("release tag must start with v")
          validate = runpy.run_path("scripts/package-release.py")["release_version"]
          version = validate(tag[1:])
          prerelease = "-" in version.split("+", 1)[0]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\nprerelease={str(prerelease).lower()}\n")

  build:
    name: Build release artifacts
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: dist
      - name: Validate public assets and checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          (cd dist && sha256sum --check --strict SHA256SUMS.txt)
          python scripts/package-release.py --version "$RELEASE_VERSION" --output-dir dist --checksums-only
          (cd dist && sha256sum --check --strict SHA256SUMS.txt)
      - name: Publish validated tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes)
          if [ "$RELEASE_PRERELEASE" = true ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${flags[@]}" \
            dist/umlgen-linux-amd64.tar.gz \
            dist/umlgen-darwin-arm64.tar.gz \
            dist/umlgen-darwin-amd64.tar.gz \
            dist/umlgen-windows-amd64.zip \
            dist/SHA256SUMS.txt
