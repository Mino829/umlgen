name: PR UML Diff

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  umlgen-diff:
    name: Generate Java change diagram
    permissions:
      contents: read
    uses: ./.github/workflows/umlgen-pr-diff.yml
    with:
      source: testdata/java/compatibility/project
      artifact-name: umlgen-pr-diff

  umlgen-go-diff:
    name: Generate Go change diagram
    permissions:
      contents: read
    uses: ./.github/workflows/umlgen-pr-diff.yml
    with:
      language: go
      source: internal/gitdiff
      artifact-name: umlgen-go-pr-diff
