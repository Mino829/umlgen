name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    name: Rehearse release candidate
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      version: 0.7.0-rc.1

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            runner: ubuntu-latest
          - name: macOS arm64
            runner: macos-15
          - name: macOS amd64
            runner: macos-15-intel
          - name: Windows amd64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'
          cache-dependency-path: go.sum
      - name: Set up minimum supported semantic-analysis JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify formatting
        if: runner.os != 'Windows'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Check vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Build
        run: go build ./cmd/umlgen
      - name: Smoke static sequence CLI
        shell: bash
        run: |
          binary=./umlgen
          if [ "$RUNNER_OS" = Windows ]; then
            binary=./umlgen.exe
          fi
          "$binary" sequence testdata/sequence/go \
            --language go --entry PlaceOrder --explain \
            --output "$RUNNER_TEMP/go-sequence.puml"
          "$binary" sequence testdata/sequence/java \
            --language java --entry PlaceOrder --java-release 17 --explain \
            --output "$RUNNER_TEMP/java-sequence.puml"
          test -s "$RUNNER_TEMP/go-sequence.puml"
          test -s "$RUNNER_TEMP/java-sequence.puml"
      - name: Smoke single-function activity CLI
        shell: bash
        run: |
          binary=./umlgen
          if [ "$RUNNER_OS" = Windows ]; then
            binary=./umlgen.exe
          fi
          "$binary" activity testdata/activity/go \
            --language go --function ProcessOrder --explain \
            --output "$RUNNER_TEMP/go-activity.puml"
          "$binary" activity testdata/activity/java \
            --language java --function processOrder --java-release 17 --explain \
            --output "$RUNNER_TEMP/java-activity.puml"
          test -s "$RUNNER_TEMP/go-activity.puml"
          test -s "$RUNNER_TEMP/java-activity.puml"
      - name: Smoke explicit state CLI
        shell: bash
        run: |
          binary=./umlgen
          if [ "$RUNNER_OS" = Windows ]; then
            binary=./umlgen.exe
          fi
          "$binary" state testdata/state/go \
            --language go --state-config testdata/state/go/machine.yaml --explain \
            --output "$RUNNER_TEMP/go-state.puml"
          "$binary" state testdata/state/java \
            --language java --state-config testdata/state/java/machine.yaml --java-release 17 --explain \
            --output "$RUNNER_TEMP/java-state.puml"
          test -s "$RUNNER_TEMP/go-state.puml"
          test -s "$RUNNER_TEMP/java-state.puml"
      - name: Smoke explicit component CLI
        shell: bash
        run: |
          binary=./umlgen
          if [ "$RUNNER_OS" = Windows ]; then
            binary=./umlgen.exe
          fi
          "$binary" component testdata/package/go \
            --language go --boundary-config testdata/component/go/architecture.yaml --explain \
            --output "$RUNNER_TEMP/go-component.puml"
          "$binary" component testdata/package/java \
            --language java --boundary-config testdata/component/java/architecture.yaml --explain \
            --output "$RUNNER_TEMP/java-component.puml"
          test -s "$RUNNER_TEMP/go-component.puml"
          test -s "$RUNNER_TEMP/java-component.puml"
      - name: Smoke declared deployment CLI
        shell: bash
        run: |
          binary=./umlgen
          if [ "$RUNNER_OS" = Windows ]; then
            binary=./umlgen.exe
          fi
          "$binary" deployment --manifest testdata/deployment/compose.yaml \
            --boundary-config testdata/deployment/architecture.yaml \
            --mapping-config testdata/deployment/compose-mapping.yaml --explain \
            --output "$RUNNER_TEMP/compose-deployment.puml"
          # The selectorless Service intentionally leaves an unknown endpoint.
          code=0
          "$binary" deployment --manifest testdata/deployment/kubernetes.yaml \
            --boundary-config testdata/deployment/architecture.yaml \
            --mapping-config testdata/deployment/kubernetes-mapping.yaml --explain \
            --output "$RUNNER_TEMP/kubernetes-deployment.puml" || code=$?
          test "$code" -eq 3
          test -s "$RUNNER_TEMP/compose-deployment.puml"
          test -s "$RUNNER_TEMP/kubernetes-deployment.puml"
      - name: Smoke safe watch regeneration
        shell: bash
        run: |
          binary=./umlgen
          if [ "$RUNNER_OS" = Windows ]; then
            binary=./umlgen.exe
          fi
          python scripts/smoke-watch.py \
            --binary "$binary" \
            --work-dir "$RUNNER_TEMP/watch-smoke"
      - name: Test macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/umlgen-installer-test"
          ./scripts/install-macos.sh \
            --version v0.3.0 \
            --install-dir "$install_dir" \
            --skip-path-update

          "$install_dir/umlgen" version
          "$install_dir/umlgen" class \
            testdata/java/compatibility/project \
            --output "$RUNNER_TEMP/macos-class-diagram.puml" \
            --quiet

          test -f "$RUNNER_TEMP/macos-class-diagram.puml"

          ./scripts/uninstall-macos.sh \
            --install-dir "$install_dir" \
            --skip-path-update

          test ! -e "$install_dir/umlgen"
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'umlgen-installer-test'
          ./scripts/install-windows.ps1 `
            -Version v0.3.0 `
            -InstallDir $installDir `
            -InstallPlantUML `
            -SkipPathUpdate

          $env:Path = "$installDir;$env:Path"
          & "$installDir\umlgen.exe" version
          & "$installDir\umlgen.exe" class `
            testdata/java/compatibility/project `
            --format svg `
            --output "$env:RUNNER_TEMP/windows-class-diagram.puml" `
            --quiet

          if (-not (Test-Path "$env:RUNNER_TEMP/windows-class-diagram.puml")) {
            throw 'PlantUML output was not created.'
          }
          if (-not (Test-Path "$env:RUNNER_TEMP/windows-class-diagram.svg")) {
            throw 'SVG output was not created.'
          }

          ./scripts/uninstall-windows.ps1 `
            -InstallDir $installDir `
            -SkipPathUpdate `
            -Confirm:$false

          if (Test-Path $installDir) {
            throw 'The Windows uninstaller did not remove the install directory.'
          }
      - name: Verify public demo
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends plantuml graphviz
          go test ./internal/cli -run '^Test((GoStructuralMemberTypes|DefaultPackageClasses)RenderSVG|ClassTitleRendersLiteralMarkupAndPreprocessorText)$' -count=1
          UMLGEN_BIN="$PWD/umlgen" \
            ./examples/order-service/generate.sh "$RUNNER_TEMP/umlgen-demo"
      - name: Verify self-generated package diagram
        if: runner.os == 'Linux'
        shell: bash
        run: |
          make diagram
          git diff --exit-code -- docs/diagrams/umlgen-packages.puml
          ./umlgen package . --language go --dependency-source imports \
            --include github.com/Mino829/umlgen --exclude testdata --exclude examples \
            --title 'umlgen package dependencies' --no-cache \
            --format svg --renderer local \
            --output "$RUNNER_TEMP/umlgen-packages.puml"
          cmp docs/diagrams/umlgen-packages.puml "$RUNNER_TEMP/umlgen-packages.puml"
          test -s "$RUNNER_TEMP/umlgen-packages.svg"
          plantuml -tpng "$RUNNER_TEMP/umlgen-packages.puml"
          test -s "$RUNNER_TEMP/umlgen-packages.png"
      - name: Upload self-generated package diagram
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: umlgen-self-package-diagram
          path: |
            ${{ runner.temp }}/umlgen-packages.puml
            ${{ runner.temp }}/umlgen-packages.svg
            ${{ runner.temp }}/umlgen-packages.png

  package-manager-definitions:
    name: Test package-manager updater
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject malformed release metadata and checksums
        run: python3 -m unittest discover -s scripts -p test_package_managers.py
      - name: Check definitions against the exact published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("bucket/umlgen.json"))["version"])')"
          python3 scripts/update-package-managers.py --version "$version" --check

  package-manager-smoke:
    name: Package manager (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Homebrew macOS arm64
            runner: macos-15
          - name: Homebrew macOS amd64
            runner: macos-15-intel
          - name: Scoop Windows amd64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install, update and uninstall with Homebrew
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/smoke-homebrew.sh
      - name: Install Scoop on the disposable Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            $installer = Join-Path $env:RUNNER_TEMP 'install-scoop.ps1'
            Invoke-WebRequest https://raw.githubusercontent.com/ScoopInstaller/Install/master/install.ps1 -OutFile $installer
            & $installer -RunAsAdmin
          }
          $scoopRoot = if ($env:SCOOP) { $env:SCOOP } else { Join-Path $HOME 'scoop' }
          (Join-Path $scoopRoot 'shims') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Scoop renderer dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          scoop bucket add java
          if ($LASTEXITCODE -ne 0) { throw 'Could not add the Java bucket.' }
          scoop bucket add extras
          if ($LASTEXITCODE -ne 0) { throw 'Could not add the Extras bucket.' }
          scoop install java/temurin17-jdk extras/plantuml main/graphviz
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Scoop renderer dependencies.' }
      - name: Install, update, render and uninstall with Scoop
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/smoke-scoop.ps1 -RenderOutputDirectory (Join-Path $env:RUNNER_TEMP 'scoop-renderer-smoke')
      - name: Upload Scoop-rendered images
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scoop-renderer-smoke
          path: ${{ runner.temp }}/scoop-renderer-smoke
          if-no-files-found: error

  pr-diagram-preview:
    name: Publish PR UML preview
    needs: [test, package-manager-smoke]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
    concurrency:
      group: umlgen-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Download package diagram
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: umlgen-self-package-diagram
          path: ${{ runner.temp }}/umlgen-preview
      - name: Download Windows rendering example
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: scoop-renderer-smoke
          path: ${{ runner.temp }}/umlgen-preview
      - name: Publish images and update the PR comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PREVIEW_DIRECTORY: ${{ runner.temp }}/umlgen-preview
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const {owner, repo} = context.repo;
            const number = context.payload.pull_request.number;
            const head = context.payload.pull_request.head.sha;
            const isCurrent = async () => {
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
              return pr.state === 'open' && pr.head.sha === head;
            };
            if (!await isCurrent()) {
              core.info('Skipping preview for an outdated or closed pull request.');
              return;
            }

            // Publish only PNG data; never check out or execute PR/artifact code.
            const treeEntries = [];
            for (const [source, target] of [
              ['umlgen-packages.png', 'packages.png'],
              ['class-png.png', 'scoop.png']
            ]) {
              const filename = path.join(process.env.PREVIEW_DIRECTORY, source);
              const stat = fs.statSync(filename);
              if (!stat.isFile() || stat.size > 10 * 1024 * 1024) {
                throw new Error(`Invalid PNG size: ${source}`);
              }
              const image = fs.readFileSync(filename);
              const signature = Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]);
              if (!image.subarray(0, 8).equals(signature)) {
                throw new Error(`Not a PNG: ${source}`);
              }
              const {data: blob} = await github.rest.git.createBlob({
                owner, repo, content: image.toString('base64'), encoding: 'base64'
              });
              treeEntries.push({path: target, mode: '100644', type: 'blob', sha: blob.sha});
            }

            // Each PR has its own image-only branch, avoiding cross-PR ref races.
            const branch = `umlgen-preview/pr-${number}`;
            let parent;
            try {
              const {data: ref} = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
              ({data: parent} = await github.rest.git.getCommit({owner, repo, commit_sha: ref.object.sha}));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const {data: tree} = await github.rest.git.createTree({
              owner, repo, tree: treeEntries
            });
            let imageCommit = parent?.sha;
            if (tree.sha !== parent?.tree.sha) {
              const {data: commit} = await github.rest.git.createCommit({
                owner, repo,
                message: `UML preview for PR #${number} (${head.slice(0, 7)})`,
                tree: tree.sha,
                parents: parent ? [parent.sha] : []
              });
              imageCommit = commit.sha;
              if (parent) {
                await github.rest.git.updateRef({owner, repo, ref: `heads/${branch}`, sha: imageCommit});
              } else {
                await github.rest.git.createRef({owner, repo, ref: `refs/heads/${branch}`, sha: imageCommit});
              }
            }
            if (!await isCurrent()) {
              core.info('PR changed during publication; not replacing its preview comment.');
              return;
            }

            const marker = '<!-- umlgen:pr-diagram-preview -->';
            const images = `https://raw.githubusercontent.com/${owner}/${repo}/${imageCommit}`;
            const repository = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}`;
            const run = `${repository}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## UML画像プレビュー',
              '',
              '### umlgenのパッケージ依存図',
              `[![umlgenのパッケージ依存図](${images}/packages.png)](${images}/packages.png)`,
              '',
              `[原寸で開く](${images}/packages.png) · [CI結果・SVG・PlantUML](${run})`,
              '',
              '<details>',
              '<summary>Windows / Scoop の画像生成確認</summary>',
              '',
              `![Windows / Scoopで生成したクラス図](${images}/scoop.png)`,
              '',
              '公開版CLIの画像生成を確認するサンプルです。PRのソース差分図ではありません。',
              '',
              '</details>',
              '',
              `PR head: [\`${head.slice(0, 7)}\`](${repository}/commit/${head}) · ` +
                `CI checkout: [\`${context.sha.slice(0, 7)}\`](${repository}/commit/${context.sha})`,
              '',
              'このコメントはpush後の検証成功時に更新されます。'
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' && comment.body.startsWith(marker));
            const {data: comment} = existing
              ? await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body})
              : await github.rest.issues.createComment({owner, repo, issue_number: number, body});
            await core.summary.addHeading('UML画像プレビュー')
              .addLink('PRの画像プレビューを開く', comment.html_url).write();
