name: Reusable umlgen PR diff

on:
  workflow_call:
    inputs:
      source:
        description: Repository-relative Java source path
        required: false
        default: .
        type: string
      depth:
        description: Relationship depth around changed types
        required: false
        default: 1
        type: number
      direction:
        description: Relation traversal direction (in, out, or both)
        required: false
        default: both
        type: string
      umlgen-version:
        description: Released umlgen tag to download
        required: false
        default: v0.6.0
        type: string
      artifact-name:
        description: Uploaded artifact name
        required: false
        default: umlgen-pr-diff
        type: string
      retention-days:
        description: Artifact retention period
        required: false
        default: 14
        type: number
      base-sha:
        description: Optional base commit override
        required: false
        default: ""
        type: string
      head-sha:
        description: Optional head commit override
        required: false
        default: ""
        type: string
    outputs:
      artifact-url:
        description: URL of the uploaded diagram artifact
        value: ${{ jobs.generate.outputs.artifact-url }}
      no-java-changes:
        description: Whether the selected source path had no changed Java files
        value: ${{ jobs.generate.outputs.no-java-changes }}

permissions:
  contents: read

concurrency:
  group: umlgen-review-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.artifact-name }}
  cancel-in-progress: true

jobs:
  filters:
    name: Validate PR review scope
    uses: ./.github/workflows/umlgen-review-filters.yml
    with:
      depth: ${{ inputs.depth }}
      direction: ${{ inputs.direction }}

  generate:
    name: Generate PR class diagram
    needs: filters
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-url: ${{ steps.artifact.outputs.artifact-url }}
      no-java-changes: ${{ steps.diagram.outputs.no-java-changes }}
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve revisions
        id: revisions
        shell: bash
        env:
          INPUT_BASE_SHA: ${{ inputs.base-sha }}
          INPUT_HEAD_SHA: ${{ inputs.head-sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BASE_SHA="${INPUT_BASE_SHA:-$EVENT_BASE_SHA}"
          HEAD_SHA="${INPUT_HEAD_SHA:-$EVENT_HEAD_SHA}"
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "::error::Base and head commits are unavailable. Call from pull_request or pass base-sha and head-sha."
            exit 1
          fi
          BASE_SHA="$(git rev-parse --verify --end-of-options "${BASE_SHA}^{commit}")"
          HEAD_SHA="$(git rev-parse --verify --end-of-options "${HEAD_SHA}^{commit}")"
          COMPARISON_BASE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          echo "base-sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head-sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "comparison-base-sha=$COMPARISON_BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Prepare review receipt
        id: receipt
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REVIEW_ARGS_JSON: ${{ needs.filters.outputs.args-json }}
          REVIEW_METADATA_JSON: ${{ needs.filters.outputs.metadata-json }}
          BASE_SHA: ${{ steps.revisions.outputs.base-sha }}
          HEAD_SHA: ${{ steps.revisions.outputs.head-sha }}
          COMPARISON_BASE_SHA: ${{ steps.revisions.outputs.comparison-base-sha }}
          SOURCE: ${{ inputs.source }}
          UMLGEN_VERSION: ${{ inputs.umlgen-version }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const args = JSON.parse(process.env.REVIEW_ARGS_JSON);
            const output = path.join(process.env.RUNNER_TEMP, 'umlgen-pr-diff');
            fs.mkdirSync(output, {recursive: true});
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'umlgen-review-args'),
              args.map(value => value + '\0').join(''), {mode: 0o600});
            const receipt = {
              ...JSON.parse(process.env.REVIEW_METADATA_JSON),
              status: 'pending',
              arguments: args,
              base_sha: process.env.BASE_SHA,
              head_sha: process.env.HEAD_SHA,
              comparison_base_sha: process.env.COMPARISON_BASE_SHA,
              source_path: process.env.SOURCE,
              umlgen_version: process.env.UMLGEN_VERSION,
              run_id: process.env.GITHUB_RUN_ID,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT,
              full_diagram: 'Unfiltered PR-head context; repository configuration still applies.'
            };
            fs.writeFileSync(path.join(output, 'review-scope.json'),
              JSON.stringify(receipt, null, 2) + '\n', {mode: 0o600});

      - name: Check out PR head for diagrams
        shell: bash
        env:
          HEAD_SHA: ${{ steps.revisions.outputs.head-sha }}
        run: git checkout --detach "$HEAD_SHA"


      - name: Download and verify umlgen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UMLGEN_VERSION: ${{ inputs.umlgen-version }}
        run: |
          set -euo pipefail
          INSTALL_DIR="$RUNNER_TEMP/umlgen"
          mkdir -p "$INSTALL_DIR"
          gh release download "$UMLGEN_VERSION" \
            --repo Mino829/umlgen \
            --pattern SHA256SUMS.txt \
            --pattern umlgen-linux-amd64.tar.gz \
            --dir "$INSTALL_DIR"
          (
            cd "$INSTALL_DIR"
            grep '  umlgen-linux-amd64.tar.gz$' SHA256SUMS.txt | sha256sum -c -
            tar -xzf umlgen-linux-amd64.tar.gz
          )
          chmod +x "$INSTALL_DIR/umlgen-linux-amd64"

      - name: Install verified PlantUML
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends default-jre-headless graphviz
          mkdir -p "$RUNNER_TEMP/plantuml"
          curl --fail --location --silent --show-error \
            https://repo.maven.apache.org/maven2/net/sourceforge/plantuml/plantuml/1.2026.6/plantuml-1.2026.6.jar \
            --output "$RUNNER_TEMP/plantuml/plantuml.jar"
          echo "e620ae095a2ba0134d3c33fd5ae34ff01e785f3df1796c0898802b8761a033a8  $RUNNER_TEMP/plantuml/plantuml.jar" |
            sha256sum --check
          echo "PLANTUML_JAR=$RUNNER_TEMP/plantuml/plantuml.jar" >> "$GITHUB_ENV"

      - name: Generate diagram
        id: diagram
        shell: bash
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base-sha }}
          HEAD_SHA: ${{ steps.revisions.outputs.head-sha }}
          SOURCE: ${{ inputs.source }}
          REVIEW_ARGS_FILE: ${{ runner.temp }}/umlgen-review-args
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/umlgen-pr-diff"
          UMLGEN_BIN="$RUNNER_TEMP/umlgen/umlgen-linux-amd64"
          mkdir -p "$OUTPUT_DIR"
          REVIEW_ARGS=()
          while IFS= read -r -d '' argument; do
            REVIEW_ARGS+=("$argument")
          done < "$REVIEW_ARGS_FILE"
          emit_placeholder_diagram() {
            local note="$1"
            printf '%s\n' \
              '@startuml' \
              'title Pull request class diagram' \
              "note \"$note\" as NoChanges" \
              '@enduml' \
              > "$OUTPUT_DIR/change-diagram.puml"
            java -jar "$PLANTUML_JAR" -tsvg "$OUTPUT_DIR/change-diagram.puml"
          }
          # Use grep -c to consume all input and avoid SIGPIPE under pipefail
          java_change_count=$(git -c core.quotepath=false diff --name-only "$BASE_SHA...$HEAD_SHA" -- "$SOURCE" | grep -Eic '\.java$' || echo 0)
          if [ "$java_change_count" -gt 0 ]; then
            # An entirely deleted source directory must still be scannable so
            # umlgen can render deleted types from Git history.
              if [ ! -e "$SOURCE" ] &&
                [ "$(git ls-tree -d "$BASE_SHA" -- "$SOURCE" | wc -l)" -gt 0 ]; then
              mkdir -p "$SOURCE"
            fi
            if "$UMLGEN_BIN" diff "$BASE_SHA...$HEAD_SHA" "$SOURCE" \
              "${REVIEW_ARGS[@]}" \
              --language java \
              --format svg \
              --renderer=jar \
              --output "$OUTPUT_DIR/change-diagram.puml" \
              --quiet 2> "$OUTPUT_DIR/umlgen.stderr"; then
              cat "$OUTPUT_DIR/umlgen.stderr" >&2
              echo "no-java-changes=false" >> "$GITHUB_OUTPUT"
            else
              umlgen_exit=$?
              umlgen_stderr="$(cat "$OUTPUT_DIR/umlgen.stderr")"
              # Handle recoverable errors:
              # - exit 1 with "no Java files found": all files excluded
              # - exit 1 with "did not contain types": no displayable types
              if [ "$umlgen_exit" -eq 1 ]; then
                if echo "$umlgen_stderr" | grep -q "no Java files found"; then
                  emit_placeholder_diagram 'All Java files excluded in the selected path'
                  echo "no-java-changes=false" >> "$GITHUB_OUTPUT"
                  echo "::notice::All Java files were excluded under $SOURCE."
                elif [ "$umlgen_stderr" = 'Error: changed Java files did not contain types in the selected target' ]; then
                  emit_placeholder_diagram 'No displayable changed Java types in the selected path'
                  echo "no-java-changes=false" >> "$GITHUB_OUTPUT"
                  echo "::notice::No displayable changed types were found under $SOURCE (umlgen exit 1)."
                else
                  cat "$OUTPUT_DIR/umlgen.stderr" >&2
                  exit "$umlgen_exit"
                fi
              else
                cat "$OUTPUT_DIR/umlgen.stderr" >&2
                exit "$umlgen_exit"
              fi
            fi
          else
            emit_placeholder_diagram 'No Java source changes in the selected path'
            echo "no-java-changes=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No changed Java files were found under $SOURCE."
          fi

      - name: Generate full diagram at PR head
        id: full
        shell: bash
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/umlgen-pr-diff"
          # Use grep -c to consume all input and avoid SIGPIPE under pipefail
          java_file_count=$(git -c core.quotepath=false ls-files -- "$SOURCE" | grep -Eic '\.java$' || echo 0)
          if [ "$java_file_count" -gt 0 ]; then
            # umlgen may fail in two recoverable cases:
            # 1. All files excluded by .umlgen.yaml or --exclude (exit 1, "no Java files found")
            # 2. Only type-less files like package-info.java (exit 5, empty diagram)
            # Other errors (parse failures, config errors) should fail the workflow.
            if "$RUNNER_TEMP/umlgen/umlgen-linux-amd64" class "$SOURCE" \
              --language java \
              --format svg \
              --renderer=jar \
              --output "$OUTPUT_DIR/full-diagram.puml" \
              --quiet 2> "$OUTPUT_DIR/umlgen-full.stderr"; then
              cat "$OUTPUT_DIR/umlgen-full.stderr" >&2
            else
              umlgen_exit=$?
              umlgen_stderr="$(cat "$OUTPUT_DIR/umlgen-full.stderr")"
              # Check if this is a recoverable error (no files or no displayable types)
              if [ "$umlgen_exit" -eq 1 ] && echo "$umlgen_stderr" | grep -q "no Java files found"; then
                # All files were excluded
                placeholder_msg="All Java files excluded under $SOURCE at PR head"
              elif [ "$umlgen_exit" -eq 5 ]; then
                # No displayable types (e.g., only package-info.java)
                placeholder_msg="No displayable Java types in the selected path at PR head"
              else
                # Unrecoverable error - propagate it
                cat "$OUTPUT_DIR/umlgen-full.stderr" >&2
                exit "$umlgen_exit"
              fi
              printf '%s\n' \
                '@startuml' \
                'title Pull request head class diagram' \
                "note \"$placeholder_msg\" as NoTypes" \
                '@enduml' \
                > "$OUTPUT_DIR/full-diagram.puml"
              java -jar "$PLANTUML_JAR" -tsvg "$OUTPUT_DIR/full-diagram.puml"
              echo "::notice::umlgen class exited with code $umlgen_exit ($placeholder_msg)."
            fi
          else
            printf '%s\n' \
              '@startuml' \
              'title Pull request head class diagram' \
              'note "No Java source files in the selected path at PR head" as NoSources' \
              '@enduml' \
              > "$OUTPUT_DIR/full-diagram.puml"
            java -jar "$PLANTUML_JAR" -tsvg "$OUTPUT_DIR/full-diagram.puml"
            echo "::notice::No Java source files were found under $SOURCE at PR head."
          fi


      - name: Summarize review scope
        if: always() && !cancelled() && steps.receipt.outcome == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DIFF_OUTCOME: ${{ steps.diagram.outcome }}
          FULL_OUTCOME: ${{ steps.full.outcome }}
          NO_JAVA_CHANGES: ${{ steps.diagram.outputs.no-java-changes }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const output = path.join(process.env.RUNNER_TEMP, 'umlgen-pr-diff');
            const file = path.join(output, 'review-scope.json');
            const receipt = JSON.parse(fs.readFileSync(file, 'utf8'));
            receipt.status = process.env.DIFF_OUTCOME === 'success' &&
              process.env.FULL_OUTCOME === 'success' ? 'generated' : 'failed';
            receipt.no_java_changes = process.env.NO_JAVA_CHANGES === 'true' ? true :
              process.env.NO_JAVA_CHANGES === 'false' ? false : null;
            if (receipt.status === 'generated') {
              for (const name of ['change-diagram.puml', 'change-diagram.svg',
                'full-diagram.puml', 'full-diagram.svg']) {
                if (!fs.statSync(path.join(output, name)).size) {
                  throw new Error('A required diagram output is empty.');
                }
              }
            }
            fs.writeFileSync(file, JSON.stringify(receipt, null, 2) + '\n');
            const escape = value => String(value).replace(/&/g, '&amp;')
              .replace(/</g, '&lt;').replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
              .replace(/\|/g, '&#124;').replace(/[\r\n]/g, ' ');
            const rows = [
              ['Result', receipt.status],
              ['Filter source', receipt.source],
              ['No changed Java files', receipt.no_java_changes ?? 'unknown'],
              ['Base commit', receipt.base_sha],
              ['Comparison merge-base', receipt.comparison_base_sha],
              ['Head commit', receipt.head_sha],
              ['Selected source path', receipt.source_path],
              ['Released CLI', receipt.umlgen_version],
              ['PR body SHA-256', receipt.body_sha256],
              ['Run / attempt', receipt.run_id + ' / ' + receipt.run_attempt]
            ];
            const summary = [
              '## umlgen review scope', '',
              '| Setting | Value |', '| --- | --- |',
              ...rows.map(([key, value]) => '| ' + key + ' | <code>' +
                escape(value) + '</code> |'), '',
              'Arguments apply only to the change diagram. Unset include/relations preserve the released CLI and repository-config defaults.',
              '<pre>' + escape(JSON.stringify(receipt.arguments, null, 2)) + '</pre>', '',
              'The full diagram is unfiltered PR-head context, not the filtered review result.',
              'Artifacts belong to this run and body digest; older runs are historical results, not a mutable latest diagram.', ''
            ].join('\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);

      - name: Upload diagram
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            ${{ runner.temp }}/umlgen-pr-diff/change-diagram.puml
            ${{ runner.temp }}/umlgen-pr-diff/change-diagram.svg
            ${{ runner.temp }}/umlgen-pr-diff/full-diagram.puml
            ${{ runner.temp }}/umlgen-pr-diff/full-diagram.svg
            ${{ runner.temp }}/umlgen-pr-diff/review-scope.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
