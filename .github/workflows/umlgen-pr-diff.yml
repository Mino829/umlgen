name: Reusable umlgen PR diff

on:
  workflow_call:
    inputs:
      source:
        description: Repository-relative Java source path
        required: false
        default: .
        type: string
      depth:
        description: Relationship depth around changed types
        required: false
        default: 1
        type: number
      direction:
        description: Relation traversal direction (in, out, or both)
        required: false
        default: both
        type: string
      umlgen-version:
        description: Released umlgen tag to download
        required: false
        default: v0.5.0
        type: string
      artifact-name:
        description: Uploaded artifact name
        required: false
        default: umlgen-pr-diff
        type: string
      retention-days:
        description: Artifact retention period
        required: false
        default: 14
        type: number
      base-sha:
        description: Optional base commit override
        required: false
        default: ""
        type: string
      head-sha:
        description: Optional head commit override
        required: false
        default: ""
        type: string
    outputs:
      artifact-url:
        description: URL of the uploaded diagram artifact
        value: ${{ jobs.generate.outputs.artifact-url }}
      no-java-changes:
        description: Whether the selected source path had no changed Java files
        value: ${{ jobs.generate.outputs.no-java-changes }}

permissions:
  contents: read

jobs:
  generate:
    name: Generate PR class diagram
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-url: ${{ steps.artifact.outputs.artifact-url }}
      no-java-changes: ${{ steps.diagram.outputs.no-java-changes }}
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve revisions
        id: revisions
        shell: bash
        env:
          INPUT_BASE_SHA: ${{ inputs.base-sha }}
          INPUT_HEAD_SHA: ${{ inputs.head-sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BASE_SHA="${INPUT_BASE_SHA:-$EVENT_BASE_SHA}"
          HEAD_SHA="${INPUT_HEAD_SHA:-$EVENT_HEAD_SHA}"
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "::error::Base and head commits are unavailable. Call from pull_request or pass base-sha and head-sha."
            exit 1
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          echo "base-sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head-sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out PR head for diagrams
        shell: bash
        env:
          HEAD_SHA: ${{ steps.revisions.outputs.head-sha }}
        run: git checkout --detach "$HEAD_SHA"


      - name: Download and verify umlgen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UMLGEN_VERSION: ${{ inputs.umlgen-version }}
        run: |
          set -euo pipefail
          INSTALL_DIR="$RUNNER_TEMP/umlgen"
          mkdir -p "$INSTALL_DIR"
          gh release download "$UMLGEN_VERSION" \
            --repo Mino829/umlgen \
            --pattern SHA256SUMS.txt \
            --pattern umlgen-linux-amd64.tar.gz \
            --dir "$INSTALL_DIR"
          (
            cd "$INSTALL_DIR"
            grep '  umlgen-linux-amd64.tar.gz$' SHA256SUMS.txt | sha256sum -c -
            tar -xzf umlgen-linux-amd64.tar.gz
          )
          chmod +x "$INSTALL_DIR/umlgen-linux-amd64"

      - name: Install verified PlantUML
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends default-jre-headless graphviz
          mkdir -p "$RUNNER_TEMP/plantuml"
          curl --fail --location --silent --show-error \
            https://repo.maven.apache.org/maven2/net/sourceforge/plantuml/plantuml/1.2026.6/plantuml-1.2026.6.jar \
            --output "$RUNNER_TEMP/plantuml/plantuml.jar"
          echo "e620ae095a2ba0134d3c33fd5ae34ff01e785f3df1796c0898802b8761a033a8  $RUNNER_TEMP/plantuml/plantuml.jar" |
            sha256sum --check
          echo "PLANTUML_JAR=$RUNNER_TEMP/plantuml/plantuml.jar" >> "$GITHUB_ENV"

      - name: Generate diagram
        id: diagram
        shell: bash
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base-sha }}
          HEAD_SHA: ${{ steps.revisions.outputs.head-sha }}
          SOURCE: ${{ inputs.source }}
          DEPTH: ${{ inputs.depth }}
          DIRECTION: ${{ inputs.direction }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/umlgen-pr-diff"
          UMLGEN_BIN="$RUNNER_TEMP/umlgen/umlgen-linux-amd64"
          mkdir -p "$OUTPUT_DIR"
          emit_placeholder_diagram() {
            local note="$1"
            printf '%s\n' \
              '@startuml' \
              'title Pull request class diagram' \
              "note \"$note\" as NoChanges" \
              '@enduml' \
              > "$OUTPUT_DIR/change-diagram.puml"
            java -jar "$PLANTUML_JAR" -tsvg "$OUTPUT_DIR/change-diagram.puml"
          }
          # Use grep -c to consume all input and avoid SIGPIPE under pipefail
          java_change_count=$(git -c core.quotepath=false diff --name-only "$BASE_SHA...$HEAD_SHA" -- "$SOURCE" | grep -Eic '\.java$' || echo 0)
          if [ "$java_change_count" -gt 0 ]; then
            # An entirely deleted source directory must still be scannable so
            # umlgen can render deleted types from Git history.
              if [ ! -e "$SOURCE" ] &&
                [ "$(git ls-tree -d "$BASE_SHA" -- "$SOURCE" | wc -l)" -gt 0 ]; then
              mkdir -p "$SOURCE"
            fi
            if "$UMLGEN_BIN" diff "$BASE_SHA...$HEAD_SHA" "$SOURCE" \
              --depth "$DEPTH" \
              --direction "$DIRECTION" \
              --format svg \
              --renderer=jar \
              --output "$OUTPUT_DIR/change-diagram.puml" \
              --quiet 2> "$OUTPUT_DIR/umlgen.stderr"; then
              cat "$OUTPUT_DIR/umlgen.stderr" >&2
              echo "no-java-changes=false" >> "$GITHUB_OUTPUT"
            else
              umlgen_exit=$?
              if [ "$umlgen_exit" -ne 1 ] ||
                [ "$(cat "$OUTPUT_DIR/umlgen.stderr")" != 'Error: changed Java files did not contain types in the selected target' ]; then
                cat "$OUTPUT_DIR/umlgen.stderr" >&2
                exit "$umlgen_exit"
              fi
              emit_placeholder_diagram 'No displayable changed Java types in the selected path'
              echo "no-java-changes=false" >> "$GITHUB_OUTPUT"
              echo "::notice::No displayable changed types were found under $SOURCE (umlgen exit 1)."
            fi
          else
            emit_placeholder_diagram 'No Java source changes in the selected path'
            echo "no-java-changes=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No changed Java files were found under $SOURCE."
          fi

      - name: Generate full diagram at PR head
        shell: bash
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/umlgen-pr-diff"
          # Use grep -c to consume all input and avoid SIGPIPE under pipefail
          java_file_count=$(git -c core.quotepath=false ls-files -- "$SOURCE" | grep -Eic '\.java$' || echo 0)
          if [ "$java_file_count" -gt 0 ]; then
            "$RUNNER_TEMP/umlgen/umlgen-linux-amd64" class "$SOURCE" \
              --language java \
              --format svg \
              --renderer=jar \
              --output "$OUTPUT_DIR/full-diagram.puml" \
              --quiet
          else
            printf '%s\n' \
              '@startuml' \
              'title Pull request head class diagram' \
              'note "No Java source files in the selected path at PR head" as NoSources' \
              '@enduml' \
              > "$OUTPUT_DIR/full-diagram.puml"
            java -jar "$PLANTUML_JAR" -tsvg "$OUTPUT_DIR/full-diagram.puml"
            echo "::notice::No Java source files were found under $SOURCE at PR head."
          fi


      - name: Upload diagram
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            ${{ runner.temp }}/umlgen-pr-diff/change-diagram.puml
            ${{ runner.temp }}/umlgen-pr-diff/change-diagram.svg
            ${{ runner.temp }}/umlgen-pr-diff/full-diagram.puml
            ${{ runner.temp }}/umlgen-pr-diff/full-diagram.svg
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
