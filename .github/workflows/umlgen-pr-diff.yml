name: Reusable umlgen PR diff

on:
  workflow_call:
    inputs:
      source:
        description: Repository-relative source path
        required: false
        default: .
        type: string
      language:
        description: Source language (java or go)
        required: false
        default: java
        type: string
      depth:
        description: Relationship depth around changed types
        required: false
        default: 1
        type: number
      direction:
        description: Relation traversal direction (in, out, or both)
        required: false
        default: both
        type: string
      umlgen-version:
        description: Released umlgen tag to download
        required: false
        default: v0.7.2
        type: string
      relationship-report:
        description: Include a text report of class relationship changes (requires a compatible released CLI)
        required: false
        default: false
        type: boolean
      artifact-name:
        description: Uploaded artifact name
        required: false
        default: umlgen-pr-diff
        type: string
      retention-days:
        description: Artifact retention period
        required: false
        default: 14
        type: number
      base-sha:
        description: Optional base commit override
        required: false
        default: ""
        type: string
      head-sha:
        description: Optional head commit override
        required: false
        default: ""
        type: string
    outputs:
      artifact-url:
        description: URL of the uploaded diagram artifact
        value: ${{ jobs.generate.outputs.artifact-url }}
      no-source-changes:
        description: Whether the selected path had no changed source files for the chosen language
        value: ${{ jobs.generate.outputs.no-source-changes }}
      no-java-changes:
        description: Legacy alias for no-source-changes in Java mode; empty in Go mode
        value: ${{ jobs.generate.outputs.no-java-changes }}

permissions:
  contents: read

concurrency:
  group: umlgen-review-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.artifact-name }}
  cancel-in-progress: true

jobs:
  filters:
    name: Validate PR review scope
    uses: ./.github/workflows/umlgen-review-filters.yml
    with:
      depth: ${{ inputs.depth }}
      direction: ${{ inputs.direction }}
      language: ${{ inputs.language }}

  generate:
    name: Generate PR class diagram
    needs: filters
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-url: ${{ steps.artifact.outputs.artifact-url }}
      no-source-changes: ${{ steps.sources.outputs.no-source-changes }}
      no-java-changes: ${{ steps.sources.outputs.no-java-changes }}
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve revisions
        id: revisions
        shell: bash
        env:
          INPUT_BASE_SHA: ${{ inputs.base-sha }}
          INPUT_HEAD_SHA: ${{ inputs.head-sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BASE_SHA="${INPUT_BASE_SHA:-$EVENT_BASE_SHA}"
          HEAD_SHA="${INPUT_HEAD_SHA:-$EVENT_HEAD_SHA}"
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "::error::Base and head commits are unavailable. Call from pull_request or pass base-sha and head-sha."
            exit 1
          fi
          BASE_SHA="$(git rev-parse --verify --end-of-options "${BASE_SHA}^{commit}")"
          HEAD_SHA="$(git rev-parse --verify --end-of-options "${HEAD_SHA}^{commit}")"
          COMPARISON_BASE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          echo "base-sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head-sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "comparison-base-sha=$COMPARISON_BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Prepare review receipt
        id: receipt
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEW_ARGS_JSON: ${{ needs.filters.outputs.args-json }}
          REVIEW_METADATA_JSON: ${{ needs.filters.outputs.metadata-json }}
          BASE_SHA: ${{ steps.revisions.outputs.base-sha }}
          HEAD_SHA: ${{ steps.revisions.outputs.head-sha }}
          COMPARISON_BASE_SHA: ${{ steps.revisions.outputs.comparison-base-sha }}
          SOURCE: ${{ inputs.source }}
          LANGUAGE: ${{ inputs.language }}
          UMLGEN_VERSION: ${{ inputs.umlgen-version }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const args = JSON.parse(process.env.REVIEW_ARGS_JSON);
            const output = path.join(process.env.RUNNER_TEMP, 'umlgen-pr-diff');
            fs.mkdirSync(output, {recursive: true});
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'umlgen-review-args'),
              args.map(value => value + '\0').join(''), {mode: 0o600});
            const receipt = {
              ...JSON.parse(process.env.REVIEW_METADATA_JSON),
              status: 'pending',
              arguments: args,
              base_sha: process.env.BASE_SHA,
              head_sha: process.env.HEAD_SHA,
              comparison_base_sha: process.env.COMPARISON_BASE_SHA,
              source_path: process.env.SOURCE,
              language: process.env.LANGUAGE,
              umlgen_version: process.env.UMLGEN_VERSION,
              run_id: process.env.GITHUB_RUN_ID,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT,
              full_diagram: 'Unfiltered PR-head context; repository configuration still applies.'
            };
            fs.writeFileSync(path.join(output, 'review-scope.json'),
              JSON.stringify(receipt, null, 2) + '\n', {mode: 0o600});

      - name: Check out PR head for diagrams
        shell: bash
        env:
          HEAD_SHA: ${{ steps.revisions.outputs.head-sha }}
        run: git checkout --detach "$HEAD_SHA"

      - name: Detect changed and current source paths
        id: sources
        shell: bash
        env:
          COMPARISON_BASE_SHA: ${{ steps.revisions.outputs.comparison-base-sha }}
          HEAD_SHA: ${{ steps.revisions.outputs.head-sha }}
          SOURCE: ${{ inputs.source }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          shopt -s nocasematch
          candidates="$RUNNER_TEMP/umlgen-source-paths"
          has_source() {
            local path
            while IFS= read -r -d '' path; do
              if [[ "$LANGUAGE" == go && "$path" == *_test.go ]]; then
                continue
              fi
              if [[ "$path" == *."$LANGUAGE" ]]; then
                return 0
              fi
            done < "$candidates"
            return 1
          }
          git --literal-pathspecs diff --no-renames --name-only -z \
            "$COMPARISON_BASE_SHA" "$HEAD_SHA" -- "$SOURCE" > "$candidates"
          no_changes=true
          if has_source; then no_changes=false; fi
          echo "no-source-changes=$no_changes" >> "$GITHUB_OUTPUT"
          if [[ "$LANGUAGE" == java ]]; then
            echo "no-java-changes=$no_changes" >> "$GITHUB_OUTPUT"
          fi
          git --literal-pathspecs ls-files -z -- "$SOURCE" > "$candidates"
          head_has_source=false
          if has_source; then head_has_source=true; fi
          echo "head-has-source=$head_has_source" >> "$GITHUB_OUTPUT"

      - name: Download and verify umlgen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UMLGEN_VERSION: ${{ inputs.umlgen-version }}
        run: |
          set -euo pipefail
          INSTALL_DIR="$RUNNER_TEMP/umlgen"
          mkdir -p "$INSTALL_DIR"
          gh release download "$UMLGEN_VERSION" \
            --repo Mino829/umlgen \
            --pattern SHA256SUMS.txt \
            --pattern umlgen-linux-amd64.tar.gz \
            --dir "$INSTALL_DIR"
          (
            cd "$INSTALL_DIR"
            grep '  umlgen-linux-amd64.tar.gz$' SHA256SUMS.txt | sha256sum -c -
            tar -xzf umlgen-linux-amd64.tar.gz
          )
          chmod +x "$INSTALL_DIR/umlgen-linux-amd64"

      - name: Install verified PlantUML
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends default-jre-headless graphviz
          mkdir -p "$RUNNER_TEMP/plantuml"
          curl --fail --location --silent --show-error \
            https://repo.maven.apache.org/maven2/net/sourceforge/plantuml/plantuml/1.2026.6/plantuml-1.2026.6.jar \
            --output "$RUNNER_TEMP/plantuml/plantuml.jar"
          echo "e620ae095a2ba0134d3c33fd5ae34ff01e785f3df1796c0898802b8761a033a8  $RUNNER_TEMP/plantuml/plantuml.jar" |
            sha256sum --check
          echo "PLANTUML_JAR=$RUNNER_TEMP/plantuml/plantuml.jar" >> "$GITHUB_ENV"

      - name: Generate diagram
        id: diagram
        shell: bash
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base-sha }}
          HEAD_SHA: ${{ steps.revisions.outputs.head-sha }}
          SOURCE: ${{ inputs.source }}
          LANGUAGE: ${{ inputs.language }}
          NO_SOURCE_CHANGES: ${{ steps.sources.outputs.no-source-changes }}
          REVIEW_ARGS_FILE: ${{ runner.temp }}/umlgen-review-args
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/umlgen-pr-diff"
          language_name=Java
          if [[ "$LANGUAGE" == go ]]; then language_name=Go; fi
          UMLGEN_BIN="$RUNNER_TEMP/umlgen/umlgen-linux-amd64"
          mkdir -p "$OUTPUT_DIR"
          REVIEW_ARGS=()
          while IFS= read -r -d '' argument; do
            REVIEW_ARGS+=("$argument")
          done < "$REVIEW_ARGS_FILE"
          emit_placeholder_diagram() {
            local note="$1"
            printf '%s\n' \
              '@startuml' \
              'title Pull request class diagram' \
              "note \"$note\" as NoChanges" \
              '@enduml' \
              > "$OUTPUT_DIR/change-diagram.puml"
            java -jar "$PLANTUML_JAR" -tsvg "$OUTPUT_DIR/change-diagram.puml"
          }
          if [[ "$NO_SOURCE_CHANGES" == false ]]; then
            # The released CLI scans the working-tree target before loading
            # deleted types from Git. Give it an empty target if PR head removed it.
            if [[ ! -e "$SOURCE" ]]; then
              mkdir -p -- "$SOURCE"
            fi
            if "$UMLGEN_BIN" diff "$BASE_SHA...$HEAD_SHA" \
              "${REVIEW_ARGS[@]}" \
              --language "$LANGUAGE" \
              --format svg \
              --renderer=jar \
              --output "$OUTPUT_DIR/change-diagram.puml" \
              --quiet -- "$SOURCE" 2> "$OUTPUT_DIR/umlgen.stderr"; then
              cat "$OUTPUT_DIR/umlgen.stderr" >&2
            else
              umlgen_exit=$?
              umlgen_stderr="$(cat "$OUTPUT_DIR/umlgen.stderr")"
              if [[ "$umlgen_exit" == 1 && "$umlgen_stderr" == *"no $language_name files found"* ]]; then
                emit_placeholder_diagram "All $language_name files excluded in the selected path"
                echo "::notice::All $language_name files were excluded in the selected path."
              elif [[ "$umlgen_exit" == 1 && "$LANGUAGE" == java &&
                "$umlgen_stderr" == 'Error: changed Java files did not contain types in the selected target' ]]; then
                # Older Java-only releases did not generate their own placeholder.
                emit_placeholder_diagram 'No displayable changed Java types in the selected path'
                echo "::notice::No displayable changed Java types were found."
              else
                cat "$OUTPUT_DIR/umlgen.stderr" >&2
                exit "$umlgen_exit"
              fi
            fi
          else
            emit_placeholder_diagram "No $language_name source changes in the selected path"
            echo "::notice::No changed $language_name files were found in the selected path."
          fi

      - name: Generate full diagram at PR head
        id: full
        shell: bash
        env:
          SOURCE: ${{ inputs.source }}
          LANGUAGE: ${{ inputs.language }}
          HEAD_HAS_SOURCE: ${{ steps.sources.outputs.head-has-source }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/umlgen-pr-diff"
          language_name=Java
          if [[ "$LANGUAGE" == go ]]; then language_name=Go; fi
          if [[ "$HEAD_HAS_SOURCE" == true ]]; then
            if "$RUNNER_TEMP/umlgen/umlgen-linux-amd64" class \
              --language "$LANGUAGE" \
              --format svg \
              --renderer=jar \
              --output "$OUTPUT_DIR/full-diagram.puml" \
              --quiet -- "$SOURCE" 2> "$OUTPUT_DIR/umlgen-full.stderr"; then
              cat "$OUTPUT_DIR/umlgen-full.stderr" >&2
            else
              umlgen_exit=$?
              umlgen_stderr="$(cat "$OUTPUT_DIR/umlgen-full.stderr")"
              if [[ "$umlgen_exit" == 1 && "$umlgen_stderr" == *"no $language_name files found"* ]]; then
                placeholder_msg="All $language_name files excluded in the selected path at PR head"
              elif [[ "$umlgen_exit" == 5 && -s "$OUTPUT_DIR/full-diagram.puml" ]] &&
                ! grep -Eq '^ *[a-z ]+ ".*" as T_' "$OUTPUT_DIR/full-diagram.puml"; then
                placeholder_msg="No displayable $language_name types in the selected path at PR head"
              else
                # Unrecoverable error - propagate it
                cat "$OUTPUT_DIR/umlgen-full.stderr" >&2
                exit "$umlgen_exit"
              fi
              printf '%s\n' \
                '@startuml' \
                'title Pull request head class diagram' \
                "note \"$placeholder_msg\" as NoTypes" \
                '@enduml' \
                > "$OUTPUT_DIR/full-diagram.puml"
              java -jar "$PLANTUML_JAR" -tsvg "$OUTPUT_DIR/full-diagram.puml"
              echo "::notice::umlgen class exited with code $umlgen_exit ($placeholder_msg)."
            fi
          else
            printf '%s\n' \
              '@startuml' \
              'title Pull request head class diagram' \
              "note \"No $language_name source files in the selected path at PR head\" as NoSources" \
              '@enduml' \
              > "$OUTPUT_DIR/full-diagram.puml"
            java -jar "$PLANTUML_JAR" -tsvg "$OUTPUT_DIR/full-diagram.puml"
            echo "::notice::No $language_name source files were found in the selected path at PR head."
          fi

      - name: Generate relationship changes report
        id: relationships
        if: inputs.relationship-report
        shell: bash
        env:
          COMPARISON_BASE_SHA: ${{ steps.revisions.outputs.comparison-base-sha }}
          HEAD_SHA: ${{ steps.revisions.outputs.head-sha }}
          SOURCE: ${{ inputs.source }}
          LANGUAGE: ${{ inputs.language }}
          REVIEW_ARGS_FILE: ${{ runner.temp }}/umlgen-review-args
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/umlgen-relationship-report"
          args=(--report relationships --language "$LANGUAGE" --quiet)
          # The validated review arguments are flag/value pairs. Only these two
          # filters apply to the snapshot report, not class-diagram traversal.
          while IFS= read -r -d '' flag && IFS= read -r -d '' value; do
            case "$flag" in
              --include|--relations) args+=("$flag" "$value") ;;
            esac
          done < "$REVIEW_ARGS_FILE"
          umlgen_exit=0
          "$RUNNER_TEMP/umlgen/umlgen-linux-amd64" diff "$COMPARISON_BASE_SHA..$HEAD_SHA" \
            "${args[@]}" -- "$SOURCE" > "$report" || umlgen_exit=$?
          case "$umlgen_exit" in
            0|3) ;;
            2)
              echo '::error::umlgen rejected the relationship report arguments. Select a released umlgen-version that supports diff --report relationships.'
              exit "$umlgen_exit"
              ;;
            *)
              echo "::error::umlgen relationship report failed (exit $umlgen_exit)."
              exit "$umlgen_exit"
              ;;
          esac

          # Exit 3 can also mean that no comparison was possible. Publish only
          # reports that reached the comparison, even if it found no changes.
          if ! grep -Eq '^(No relationship changes detected in the analyzed scope\.$|(added|removed|evidence-changed|uncertain) .+ -> .+)' "$report"; then
            echo "::error::umlgen did not produce a usable relationship comparison (exit $umlgen_exit)."
            exit 1
          fi
          status=complete
          if [[ "$umlgen_exit" == 3 ]]; then
            status=incomplete
            echo '::warning::The relationship report is incomplete; selected sources failed to parse.'
          fi
          mv -- "$report" "$RUNNER_TEMP/umlgen-pr-diff/relationship-changes.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Summarize review scope
        if: always() && !cancelled() && steps.receipt.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DIFF_OUTCOME: ${{ steps.diagram.outcome }}
          FULL_OUTCOME: ${{ steps.full.outcome }}
          NO_SOURCE_CHANGES: ${{ steps.sources.outputs.no-source-changes }}
          NO_JAVA_CHANGES: ${{ steps.sources.outputs.no-java-changes }}
          RELATIONSHIP_REPORT: ${{ inputs.relationship-report }}
          RELATIONSHIP_OUTCOME: ${{ steps.relationships.outcome }}
          RELATIONSHIP_STATUS: ${{ steps.relationships.outputs.status }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const output = path.join(process.env.RUNNER_TEMP, 'umlgen-pr-diff');
            const file = path.join(output, 'review-scope.json');
            const receipt = JSON.parse(fs.readFileSync(file, 'utf8'));
            receipt.status = process.env.DIFF_OUTCOME === 'success' &&
              process.env.FULL_OUTCOME === 'success' ? 'generated' : 'failed';
            if (process.env.RELATIONSHIP_REPORT === 'true') {
              const outcome = process.env.RELATIONSHIP_OUTCOME;
              receipt.relationship_report_status = outcome === 'success' ? process.env.RELATIONSHIP_STATUS :
                outcome === 'failure' ? 'failed' : 'not-run';
              if (outcome !== 'success') {
                receipt.status = 'failed';
              }
            }
            receipt.no_source_changes = process.env.NO_SOURCE_CHANGES === 'true' ? true :
              process.env.NO_SOURCE_CHANGES === 'false' ? false : null;
            receipt.no_java_changes = process.env.NO_JAVA_CHANGES === 'true' ? true :
              process.env.NO_JAVA_CHANGES === 'false' ? false : null;
            if (receipt.status === 'generated') {
              for (const name of ['change-diagram.puml', 'change-diagram.svg',
                'full-diagram.puml', 'full-diagram.svg']) {
                if (!fs.statSync(path.join(output, name)).size) {
                  throw new Error('A required diagram output is empty.');
                }
              }
            }
            fs.writeFileSync(file, JSON.stringify(receipt, null, 2) + '\n');
            const escape = value => String(value).replace(/&/g, '&amp;')
              .replace(/</g, '&lt;').replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
              .replace(/\|/g, '&#124;').replace(/[\r\n]/g, ' ');
            const rows = [
              ['Result', receipt.status],
              ['Filter source', receipt.source],
              ['Language', receipt.language],
              ['No changed source files', receipt.no_source_changes ?? 'unknown'],
              ['Base commit', receipt.base_sha],
              ['Comparison merge-base', receipt.comparison_base_sha],
              ['Head commit', receipt.head_sha],
              ['Selected source path', receipt.source_path],
              ['Released CLI', receipt.umlgen_version],
              ['PR body SHA-256', receipt.body_sha256],
              ['Run / attempt', receipt.run_id + ' / ' + receipt.run_attempt]
            ];
            if (receipt.relationship_report_status) {
              rows.push(['Relationship report', receipt.relationship_report_status]);
            }
            const summary = [
              '## umlgen review scope', '',
              '| Setting | Value |', '| --- | --- |',
              ...rows.map(([key, value]) => '| ' + key + ' | <code>' +
                escape(value) + '</code> |'), '',
              receipt.relationship_report_status ?
                'The change diagram uses all listed arguments; the relationship report uses only include/relations. Unset include/relations preserve the released CLI and repository-config defaults.' :
                'Arguments apply only to the change diagram. Unset include/relations preserve the released CLI and repository-config defaults.',
              '<pre>' + escape(JSON.stringify(receipt.arguments, null, 2)) + '</pre>', '',
              'The full diagram is unfiltered PR-head context, not the filtered review result.',
              'Artifacts belong to this run and body digest; older runs are historical results, not a mutable latest diagram.', ''
            ].join('\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);

      - name: Upload diagram
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            ${{ runner.temp }}/umlgen-pr-diff/change-diagram.puml
            ${{ runner.temp }}/umlgen-pr-diff/change-diagram.svg
            ${{ runner.temp }}/umlgen-pr-diff/full-diagram.puml
            ${{ runner.temp }}/umlgen-pr-diff/full-diagram.svg
            ${{ runner.temp }}/umlgen-pr-diff/review-scope.json
            ${{ inputs.relationship-report && format('{0}/umlgen-pr-diff/relationship-changes.txt', runner.temp) || '' }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
